<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>ClaudeMeter — Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header>
      <h1>ClaudeMeter Options</h1>
    </header>

    <section class="card">
      <h2>Refresh</h2>
      <label class="row">
        <span>
          Refresh interval
          <small>How often the background worker fetches usage in the background.</small>
        </span>
        <span class="slider-value" id="refreshIntervalValue">5 min</span>
      </label>
      <input type="range" id="refreshIntervalSlider" min="1" max="30" step="1" />
    </section>

    <section class="card">
      <h2>Notifications</h2>
      <label class="row">
        <span>
          Notify at usage thresholds
          <small>Desktop notification when session or weekly usage crosses a threshold.</small>
        </span>
        <input type="checkbox" id="notificationsToggle" />
      </label>
      <div class="row" id="thresholdsRow">
        <span>Thresholds</span>
        <div class="threshold-checks">
          <label><input type="checkbox" class="threshold-check" value="80" /> 80%</label>
          <label><input type="checkbox" class="threshold-check" value="95" /> 95%</label>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>On claude.ai</h2>
      <label class="row">
        <span>
          Usage pill next to the composer
          <small>Shows session and weekly % right where you type. Click it for reset times.</small>
        </span>
        <input type="checkbox" id="inlinePillToggle" />
      </label>
      <label class="row">
        <span>
          Usage in the tab
          <small>Session % on the claude.ai tab itself, so you can see it from any other tab.</small>
        </span>
        <select id="tabIndicatorSelect">
          <option value="off">Off</option>
          <option value="title">Title prefix — [42%]</option>
          <option value="favicon">Favicon</option>
          <option value="both">Title and favicon</option>
        </select>
      </label>
      <label class="row">
        <span>
          Warn before sending
          <small>A banner above the composer while you type, once any limit is this full.</small>
        </span>
        <select id="preSendWarnSelect">
          <option value="0">Off</option>
          <option value="50">At 50%</option>
          <option value="70">At 70%</option>
          <option value="80">At 80%</option>
          <option value="90">At 90%</option>
          <option value="95">At 95%</option>
        </select>
      </label>
      <label class="row">
        <span>
          Model-switch hint
          <small>
            Suggests a lighter model when a model-specific weekly limit (e.g. Opus) is your fastest-filling one and
            this full.
          </small>
        </span>
        <select id="modelHintSelect">
          <option value="0">Off</option>
          <option value="30">At 30%</option>
          <option value="50">At 50%</option>
          <option value="70">At 70%</option>
          <option value="90">At 90%</option>
        </select>
      </label>
      <label class="row">
        <span>
          Long-chat nudge
          <small>Suggests starting a new chat once the thread is roughly this long.</small>
        </span>
        <select id="longContextSelect">
          <option value="0">Off</option>
          <option value="20000">~20k tokens</option>
          <option value="40000">~40k tokens</option>
          <option value="80000">~80k tokens</option>
          <option value="120000">~120k tokens</option>
        </select>
      </label>
      <label class="row">
        <span>
          Attachment weight warning
          <small>Flags heavy files, long pastes, and large project knowledge before you send.</small>
        </span>
        <select id="attachmentWarnSelect">
          <option value="0">Off</option>
          <option value="10000">~10k tokens</option>
          <option value="25000">~25k tokens</option>
          <option value="50000">~50k tokens</option>
          <option value="100000">~100k tokens</option>
        </select>
      </label>
      <label class="row">
        <span>
          Measure what each message costs
          <small>Reads your usage right before you send and right after the reply ends.</small>
        </span>
        <input type="checkbox" id="messageCostToggle" />
      </label>
    </section>

    <section class="card">
      <h2>Appearance</h2>
      <label class="row">
        <span>Theme</span>
        <select id="themeSelect">
          <option value="auto">Auto (match system)</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>Developer / Debug</h2>
      <label class="row">
        <span>
          Developer mode
          <small>Keeps raw request/response captures for inspection on the debug page.</small>
        </span>
        <input type="checkbox" id="developerModeToggle" />
      </label>
      <a class="debug-link" href="../debug/debug.html">Open Debug Captures &rarr;</a>
    </section>

    <section class="card">
      <h2>Data</h2>
      <button id="clearDataBtn" class="danger">Clear stored data</button>
      <p class="hint">Removes all captured requests, usage history, and org lookup cache.</p>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>
