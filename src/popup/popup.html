<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>ClaudeMeter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <span class="wordmark">ClaudeMeter</span>
        <span class="badge" id="planBadge" hidden></span>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" title="Refresh now" aria-label="Refresh now">
        <svg class="refresh-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" />
          <path d="M13.5 2.5V5H11" />
        </svg>
      </button>
    </header>

    <main>
      <!-- Empty state: no data ever captured -->
      <section id="emptyState" class="state" hidden>
        <p class="empty-icon">&#9711;</p>
        <p class="empty-title">No usage data yet</p>
        <p class="empty-body">Open claude.ai in a tab to start tracking your usage.</p>
        <button id="openClaudeBtn">Open claude.ai</button>
      </section>

      <!-- Loading state: first-ever fetch in flight, nothing to show yet -->
      <section id="loadingState" class="state" hidden>
        <div class="skeleton-row"></div>
        <div class="skeleton-bar"></div>
        <div class="skeleton-row" style="width: 60%"></div>
        <div class="skeleton-bar"></div>
      </section>

      <!-- Data state -->
      <section id="dataState" hidden>
        <div class="usage-row">
          <div class="usage-row-head">
            <span class="usage-label" id="sessionLabel">Current session</span>
            <span class="usage-pct" id="sessionPct"></span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="sessionFill"></div>
          </div>
          <p class="usage-sub" id="sessionResets"></p>
          <p class="usage-sub" id="lastMessage" hidden></p>
        </div>

        <hr />

        <div class="weekly-header">
          <span>Weekly limits</span>
          <a
            id="learnMoreLink"
            href="https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work"
            target="_blank"
            rel="noopener noreferrer"
            >Learn more</a
          >
        </div>
        <div id="weeklyList"></div>

        <div id="topChats" hidden>
          <hr />
          <div class="weekly-header">
            <span>Most expensive chats</span>
            <span class="header-note">% of a session</span>
          </div>
          <ol id="topChatsList" class="chat-list"></ol>
        </div>

        <p class="usage-sub limit-hits" id="limitHits" hidden></p>

        <!-- Dashboard-only: shown in the side panel / full-tab view, not the toolbar popup -->
        <div id="history" class="history" hidden>
          <hr />
          <div class="weekly-header">
            <span>Usage over time</span>
            <span class="header-note" id="historyRange"></span>
          </div>
          <div id="historyBody">
            <svg id="historyChart" class="history-chart" viewBox="0 0 320 120" preserveAspectRatio="none" role="img"></svg>
            <div class="history-axis"><span id="historyFrom"></span><span>now</span></div>
            <ul id="historyLegend" class="history-legend"></ul>
          </div>
          <p class="usage-sub" id="historyEmpty" hidden>
            Not enough history yet — this fills in as ClaudeMeter refreshes.
          </p>
        </div>
      </section>

      <p id="errorBanner" class="error-banner" hidden></p>
    </main>

    <footer>
      <span id="lastUpdated"></span>
      <div class="footer-actions">
        <button
          id="sidePanelBtn"
          class="icon-btn"
          type="button"
          title="Open in the side panel"
          aria-label="Open in the side panel"
          hidden
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="3" width="12" height="10" rx="1.5" />
            <path d="M10 3v10" />
          </svg>
        </button>
        <button id="settingsLink" class="icon-btn" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 4h6M12 4h2M2 8h2M8 8h6M2 12h7M13 12h1" />
            <circle cx="10" cy="4" r="1.6" />
            <circle cx="6" cy="8" r="1.6" />
            <circle cx="11" cy="12" r="1.6" />
          </svg>
        </button>
      </div>
    </footer>

    <template id="weeklyRowTemplate">
      <div class="usage-row">
        <div class="usage-row-head">
          <span class="usage-label"></span>
          <span class="usage-pct"></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <p class="usage-sub"></p>
      </div>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
